name: Deploy chemistry tracker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PDF validation tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Validate checklist and browser scripts
        run: |
          python3 -m unittest discover -s tests -v
          node --check app/app.js
          node --check app/work.js
          node --check app/data.js
          node --check app/official-data.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir _site
          cp -R app/. _site/
          printf '%s\n' 'window.ELEMENT_DEPLOYMENT = { staticHosting: true };' > _site/deployment-config.js
          touch _site/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
